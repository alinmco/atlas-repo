# În fiecare luni dimineață, Claude rulează /sanatate: re-verifică repo-urile și prețurile
# expirate și deschide un Pull Request cu ce s-a schimbat.
# Necesită secretul CLAUDE_CODE_OAUTH_TOKEN (abonament Claude) sau ANTHROPIC_API_KEY
# (vezi GHID-START.md, pasul 9). Poți porni manual din tab-ul Actions → Run workflow.
name: Sănătate săptămânală

on:
  schedule:
    - cron: "17 5 * * 1" # luni, 05:17 UTC (08:17 ora României vara, 07:17 iarna)
  workflow_dispatch:

concurrency:
  group: sanatate
  cancel-in-progress: false

jobs:
  sanatate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg jq && pip install uv
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Dacă folosești o cheie API în loc de abonament, înlocuiește linia de mai sus cu:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          settings: .claude/settings.json
          prompt: "/sanatate"
          claude_args: "--max-turns 400"
